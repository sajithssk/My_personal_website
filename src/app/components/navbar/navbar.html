<nav [class.scrolled]="isScrolled">
  <div class="nav-brand">
    <span class="logo-text">SSK</span>
    <span class="logo-dot">.</span>
  </div>

  <ul class="nav-links" [class.open]="mobileMenuOpen">
    <li *ngFor="let tab of tabs">
      <a
        (click)="scrollToSection(tab.section, tab.path)"
        [class.active]="isActive(tab.section)">
        <i class="fas {{tab.icon}}"></i>
        <span>{{ tab.label }}</span>
      </a>
    </li>
  </ul>

  <div class="nav-actions">
    <app-theme-toggle></app-theme-toggle>
    <div class="mobile-menu" (click)="toggleMenu()">
      <i class="fas" [class.fa-bars]="!mobileMenuOpen" [class.fa-times]="mobileMenuOpen"></i>
    </div>
  </div>
</nav>
